name: Build IPA

on:
  push:
    branches: ["main", "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project LearnUI.xcodeproj \
            -scheme LearnUI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          test ${PIPESTATUS[0]} -eq 0

      - name: Show errors
        if: failure()
        run: grep -n -E "error:" build.log | head -80 || true

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/LearnUI.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry LearnUI.ipa Payload
          ls -lh LearnUI.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LearnUI-ipa
          path: LearnUI.ipa
          retention-days: 30
